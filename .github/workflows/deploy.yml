name: Deploy

# Staging deploys automatically after every push to main (once secrets exist).
# Production deploys ONLY when started by hand, and the "production" GitHub
# environment should require the owner's approval (Settings → Environments).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::Cloudflare secrets not set yet — skipping deploy (see docs/DEPLOY.md)."; fi
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  staging:
    needs: checks
    if: needs.checks.outputs.ready == 'true' && (github.event_name == 'push' || github.event.inputs.target == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build for staging
        run: CLOUDFLARE_ENV=staging npm run build
      - name: Apply D1 migrations (staging)
        run: npx wrangler d1 migrations apply brainzippy-db-staging --remote --env staging
      - name: Deploy
        run: npx wrangler deploy
      - name: Smoke test
        if: vars.STAGING_URL != ''
        run: curl -fsS "${{ vars.STAGING_URL }}/api/health"

  production:
    needs: checks
    if: needs.checks.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build for production
        run: CLOUDFLARE_ENV=production npm run build
      - name: Apply D1 migrations (production)
        run: npx wrangler d1 migrations apply brainzippy-db --remote --env production
      - name: Deploy
        run: npx wrangler deploy
      - name: Smoke test
        run: curl -fsS https://brainzippy.com/api/health
