name: Deploy

# Staging deploys automatically after every push to main (once secrets exist).
# Production deploys ONLY when started by hand, and the "production" GitHub
# environment should require the owner's approval (Settings → Environments).
#
# Order (docs/DEPLOY.md): build → migrate if the database already exists → wrangler deploy (automatic provisioning
# creates the D1 database named in wrangler.jsonc on the very first deploy, and finds it by name afterwards) →
# migrate (applies everything on a brand-new database; a no-op otherwise) → smoke test (health + the live feature
# flags must match the build's).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::Cloudflare secrets not set yet — skipping deploy (see docs/DEPLOY.md)."; fi
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  staging:
    needs: checks
    if: needs.checks.outputs.ready == 'true' && (github.event_name == 'push' || github.event.inputs.target == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build for staging
        run: CLOUDFLARE_ENV=staging npm run build
      - name: Apply D1 migrations before deploying (skipped until the database exists)
        run: ./scripts/ci-d1.sh pre brainzippy-db-staging staging
      - name: Deploy (the first deploy creates the D1 database)
        run: npx wrangler deploy
      - name: Apply D1 migrations
        run: ./scripts/ci-d1.sh post brainzippy-db-staging staging
      - name: Smoke test
        if: vars.STAGING_URL != ''
        run: ./scripts/ci-smoke.sh "${{ vars.STAGING_URL }}"

  production:
    needs: checks
    if: needs.checks.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build for production
        run: CLOUDFLARE_ENV=production npm run build
      - name: Apply D1 migrations before deploying (skipped until the database exists)
        run: ./scripts/ci-d1.sh pre brainzippy-db production
      - name: Deploy (the first deploy creates the D1 database and the brainzippy.com custom domain)
        run: npx wrangler deploy
      - name: Apply D1 migrations
        run: ./scripts/ci-d1.sh post brainzippy-db production
      - name: Smoke test
        run: ./scripts/ci-smoke.sh https://brainzippy.com
