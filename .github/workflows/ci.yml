name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate:local
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report, retention-days: 14 }
  # Deployment is intentionally manual. To enable staging deploys, add a job using
  # cloudflare/wrangler-action@v4 with secrets.CLOUDFLARE_API_TOKEN and CLOUDFLARE_ENV=staging.
  # Production requires explicit owner approval (see .claude/skills/cloudflare-deployment).
