<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8fd0ff">
<title>Offline — BrainZippy</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Shown by the service worker for pages that aren't saved on this device. Self-contained: no network needed. -->
<style>
  :root { --ink: #2b2140; --ink-soft: #5a5070; --paper: #fffdf6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center; padding: 24px;
    background: #bfe6ff; color: var(--ink);
    font: 400 1.15rem/1.5 "Nunito", system-ui, sans-serif; text-align: center;
  }
  main { max-width: 460px; background: var(--paper); border: 5px solid var(--ink); border-radius: 32px; padding: 28px 24px 30px; box-shadow: 0 10px 0 rgba(43, 33, 64, 0.18); }
  h1 { font-family: "Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif; font-weight: 800; font-size: 2rem; line-height: 1.1; margin: 8px 0 6px; }
  p { margin: 8px 0; color: var(--ink-soft); }
  svg.bobbo { width: 150px; height: 150px; animation: bob 2.4s ease-in-out infinite; }
  a.go {
    display: inline-flex; align-items: center; justify-content: center; min-height: 64px; min-width: 180px; margin-top: 14px;
    padding: 0 28px; border-radius: 999px; color: #fff; text-decoration: none; font-weight: 800; font-size: 1.3rem;
    background: linear-gradient(#8ae86f, #45b83a); box-shadow: 0 6px 0 #2d8a27;
  }
  a.go:active { transform: translateY(3px); box-shadow: 0 3px 0 #2d8a27; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { svg.bobbo { animation: none; } }
</style>
</head>
<body>
<main data-testid="offline-page">
  <svg class="bobbo" viewBox="0 0 64 64" aria-hidden="true">
    <path d="M32 8 C48 8 56 30 56 42 C56 54 46 60 32 60 C18 60 8 54 8 42 C8 30 16 8 32 8 Z" fill="#FF9F43" stroke="#2B2140" stroke-width="3"/>
    <circle cx="24" cy="34" r="6" fill="#fff" stroke="#2B2140" stroke-width="2.5"/>
    <circle cx="40" cy="34" r="6" fill="#fff" stroke="#2B2140" stroke-width="2.5"/>
    <circle cx="23" cy="33" r="2.6" fill="#2B2140"/>
    <circle cx="39" cy="33" r="2.6" fill="#2B2140"/>
    <path d="M27 47 Q32 45 37 47" fill="none" stroke="#2B2140" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
  <h1>No internet right now</h1>
  <p>This page isn't saved on this device yet.</p>
  <p>Games you've already played still work offline.</p>
  <a class="go" href="/" aria-label="Go to BrainZippy games">Play</a>
</main>
</body>
</html>
